<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCRFB | Sitio en Construcción</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ============================
   ACCRFB - MANTENIMIENTO PAGE
============================ */

:root {
    --primary: #1e5f38;
    --secondary: #1e3a8a;
    --accent: #10b981;
    --white: #ffffff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(30,95,56,0.95), rgba(30,58,138,0.95)),
                url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=1600') center/cover;
    color: white;
    text-align: center;
    overflow: hidden;
}

.container {
    max-width: 800px;
    padding: 2rem;
    animation: fadeIn 1.2s ease;
}

/* LOGO */
.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-bottom: 1.5rem;
}

.logo img {
    width: 60px;
    height: 60px;
    object-fit: contain;
}

.logo-text {
    font-size: 1.8rem;
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #10b981, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* TITULO */
h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    margin-bottom: 1rem;
}

p {
    font-size: 1.1rem;
    opacity: 0.9;
    margin-bottom: 2rem;
    line-height: 1.6;
}

/* ICONO */
.icon {
    font-size: 4rem;
    color: var(--accent);
    margin-bottom: 1.5rem;
    animation: pulse 2s infinite;
}

/* BARRA DE PROGRESO */
.progress {
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.2);
    border-radius: 50px;
    overflow: hidden;
    margin: 2rem 0;
}

.progress-bar {
    width: 70%;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #3b82f6);
    animation: loading 3s infinite;
}

/* BOTÓN */
.btn {
    display: inline-block;
    padding: 1rem 2rem;
    border-radius: 50px;
    background: linear-gradient(135deg, var(--accent), #059669);
    color: white;
    font-weight: 700;
    text-decoration: none;
    transition: 0.3s;
}

.btn:hover {
    transform: translateY(-3px);
}

/* REDES */
.social {
    margin-top: 2rem;
    display: flex;
    justify-content: center;
    gap: 1rem;
}

.social a {
    width: 45px;
    height: 45px;
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    transition: 0.3s;
}

.social a:hover {
    background: var(--accent);
    transform: translateY(-3px);
}

/* ANIMACIONES */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes pulse {
    0% {transform: scale(1);}
    50% {transform: scale(1.1);}
    100% {transform: scale(1);}
}

@keyframes loading {
    0% {width: 20%;}
    50% {width: 80%;}
    100% {width: 20%;}
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .logo-text {
        font-size: 1.3rem;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <div class="logo">
        <img src="logo.png" alt="ACCRFB">
        <div class="logo-text">ACC<span>RFB</span></div>
    </div>

    <!-- ICONO -->
    <div class="icon">
        <i class="fas fa-hard-hat"></i>
    </div>

    <!-- TEXTO -->
    <h1>Sitio en Construcción</h1>
    <p>
        Estamos trabajando para ofrecerte una experiencia mejorada.  
        Nuestro servidor está siendo preparado con nuevas funciones, diseño y servicios para la comunidad cubana en Brasil.
    </p>

    <!-- PROGRESO -->
    <div class="progress">
        <div class="progress-bar"></div>
    </div>

    <p><strong>Próximamente disponible</strong></p>

    <!-- BOTÓN -->
    <a href="mailto:contacto@accrfb.org" class="btn">
        Contactar Soporte
    </a>

    <!-- REDES -->
    <div class="social">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
    </div>

</div>

</body>
</html>
